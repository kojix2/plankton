name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  crystal:
    name: Crystal / Ameba
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main
      - uses: crystal-lang/install-crystal@master
        with:
          crystal: latest
          shards: latest
      - run: make check-crystal

  web:
    name: JavaScript / real Wasm / browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version: latest
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Real Crystal compiler integration (all examples)
        run: npm run test:wasm
      - name: Same-origin static build
        run: npm run build
      - name: Chrome WebGL and browser compilation
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Playwright UI and real compiler regression tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:playwright
      - uses: actions/upload-artifact@main
        with:
          name: checked-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
